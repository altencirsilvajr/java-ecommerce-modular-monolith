apiVersion: v1
kind: ConfigMap
metadata: {name: ecommerce-config}
data: {DATABASE_URL: "jdbc:postgresql://postgres:5432/ecommerce", REDIS_HOST: redis, RABBITMQ_HOST: rabbitmq, RABBITMQ_USER: ecommerce}
---
apiVersion: v1
kind: Secret
metadata: {name: ecommerce-secrets}
type: Opaque
stringData: {DATABASE_USER: ecommerce, DATABASE_PASSWORD: change-me, RABBITMQ_PASSWORD: change-me, JWT_SECRET: change-me-with-at-least-32-bytes}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ecommerce-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: ecommerce-api}}
  template:
    metadata: {labels: {app: ecommerce-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/altencirsilvajr/java-ecommerce-modular-monolith:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: ecommerce-config}}, {secretRef: {name: ecommerce-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: ecommerce-api}
spec: {selector: {app: ecommerce-api}, ports: [{name: http, port: 80, targetPort: 8080}]}
